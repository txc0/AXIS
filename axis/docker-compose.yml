services:
  web:
    build:
      context: .
      args:
        VITE_GOOGLE_MAPS_API_KEY: ${VITE_GOOGLE_MAPS_API_KEY:-}
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_PATH: /app/data/axis.db
    ports:
      - "${AXIS_HOST_BIND:-0.0.0.0}:${AXIS_HOST_PORT:-3000}:3000"
    volumes:
      - axis-data:/app/data   # database survives rebuilds and restarts
volumes:
  axis-data: {}